name: Build TelePremium APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Align Gradle wrapper with Android Gradle Plugin
        run: |
          sed -i 's/gradle-7.0.2-bin.zip/gradle-8.6-bin.zip/' upstream/Telegram/gradle/wrapper/gradle-wrapper.properties
          grep distributionUrl upstream/Telegram/gradle/wrapper/gradle-wrapper.properties

      - name: Apply TelePremium patches
        run: |
          python3 scripts/apply_telepremium_patches.py
          python3 scripts/verify_source.py
      - name: Build APK
        working-directory: upstream/Telegram
        run: |
          chmod +x gradlew
          python3 -c "import json; p='TMessagesProj_App/google-services.json'; d=json.load(open(p,encoding='utf-8')); clients=d.get('client',[]); base=clients[0] if clients else None; clone=json.loads(json.dumps(base)) if base else None; clone and clone.setdefault('client_info',{}).setdefault('android_client_info',{}).__setitem__('package_name','com.telepremium.messenger.beta'); clone and clients.append(clone); open(p,'w',encoding='utf-8').write(json.dumps(d,separators=(',',':'))) if clone else None"
          ./gradlew TMessagesProj_App:assembleDebug --stacktrace
      - name: Collect APK
        if: always()
        run: |
          mkdir -p artifacts
          find upstream/Telegram -type f -name '*.apk' -exec cp {} artifacts/ \; || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: TelePremium-Cloud-APK
          path: artifacts/*.apk
          if-no-files-found: warn

# compile-fix trigger
